name = "pctopc"
main = "index.js"
compatibility_date = "2024-04-04"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "CHATROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChatRoom"]

[[d1_databases]]
binding = "DB"
database_name = "pctopc"
database_id = "your-d1-database-id"

[vars]
ALLOWED_ORIGIN = "https://yoursite.com"